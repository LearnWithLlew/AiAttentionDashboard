name: build-and-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '14 7 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: ./build-and-test
      - run: dotnet pack src/AIAttentionDashboard -c Release -o artifacts -p:Version=0.0.0-ci.${{ github.run_number }}
