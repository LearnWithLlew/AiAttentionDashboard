<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>AI Attention Dashboard</title></head>
<body>
<p>Nothing needs your attention yet.</p>
<script>
{
    const events = new EventSource('/events');
    events.addEventListener('refresh', () => location.reload());
    const closeIfServerGone = () => fetch('/ping').catch(() => {
        events.close();
        window.close();
        document.body.innerHTML = '<p>The dashboard server has stopped. You can close this tab.</p>';
    });
    events.addEventListener('error', () => setTimeout(closeIfServerGone, 1000));
    const reportSize = () => fetch('/size', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ width: innerWidth, height: innerHeight }),
    });
    let resizeTimer;
    addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(reportSize, 200); });
    reportSize();
}
</script>
</body>
</html>
